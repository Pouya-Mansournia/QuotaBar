name: Bug report
description: Something shows the wrong value, crashes, or does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste tokens, `auth.json`, or `.credentials.json` contents. The diagnostics export (macOS) is already redacted."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuotaBar version and OS version
      placeholder: "QuotaBar 1.0.2, macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Claude (account source), Claude (status line bridge), Codex, Not provider-specific]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: tools
    attributes:
      label: Claude Code / Codex CLI versions
      placeholder: "claude --version, codex --version"
